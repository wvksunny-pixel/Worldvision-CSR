<title>월드비전 기업파트너십</title>
<meta name="description" content="월드비전 기업파트너십 인터랙티브 제안 플랫폼: 사업 탐색, 사업 상세, 맞춤형 제안 구성">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap">
<style>
/* Layout concept: white Swiss 12-column editorial grid. Brand colour #F56400 (worldvision.or.kr) only for key
   messages, figures and interactions; one brand block per page. Noto Sans KR throughout.
   Single light "print" theme by choice — every colour is set explicitly. */
:root{
  --orange:#f56400; --orange-ink:#c24e00; --brand:#f56400; --navy:#111a26; --peach:#ffd3b3; --peach-bg:#fff2e8;
  --ink:#141414; --char:#262626; --mute:#666666; --rule:#e3e1de; --stone:#f4f3f1; --paper:#ffffff;
  --memo:#1d232b; --memo-ink:#e9edf2; --memo-acc:#ffcf5c;
  --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --lat:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --max:1320px; --g:clamp(16px,3vw,40px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--kr);font-size:15.5px;line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.035em}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--g)}
.lat{font-family:var(--lat);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--lat);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.top .wrap{height:68px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo img{height:24px;width:auto}
.logo span{font-size:13px;font-weight:700;color:var(--mute);border-left:1px solid var(--rule);padding-left:12px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs a{font-family:var(--lat);font-weight:800;font-size:13px;letter-spacing:.08em;padding:9px 14px;color:#555;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tabs a small{font-family:var(--kr);font-weight:700;letter-spacing:0;font-size:12.5px;color:var(--mute)}
.tabs a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--orange)}
.tabs a:hover{color:var(--ink)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--orange);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;letter-spacing:0}
.badge[data-n="0"]{background:var(--rule);color:var(--mute)}
.pswitch{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--mute);border:1px solid var(--rule);padding:7px 12px 7px 10px;white-space:nowrap}
.pswitch i{width:30px;height:17px;border-radius:9px;background:var(--rule);position:relative;transition:background .2s}
.pswitch i:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s}
.pswitch[aria-pressed="true"]{color:var(--ink);border-color:var(--memo)}
.pswitch[aria-pressed="true"] i{background:var(--memo)}
.pswitch[aria-pressed="true"] i:after{transform:translateX(13px);background:var(--memo-acc)}

/* ---------- shared ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:15px;padding:15px 22px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);transition:background .15s,color .15s}
.btn:hover{background:var(--ink);color:#fff}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:var(--orange);border-color:var(--orange)}
.btn.or{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.or:hover{background:var(--ink);border-color:var(--ink)}
.btn.sm{font-size:13.5px;padding:10px 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.add{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;padding:9px 13px;border:1.5px solid var(--ink);background:#fff;white-space:nowrap}
.add:hover{background:var(--ink);color:#fff}
.add.in{background:var(--orange);border-color:var(--orange);color:#fff}
.add .pl{font-family:var(--lat);font-size:16px;line-height:1}
.sec{padding-block:clamp(64px,9vw,120px)}
.sec.stone{background:var(--stone)}
.sec-head{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-bottom:48px;align-items:end}
.sec-head .label{grid-column:1/-1;color:var(--orange-ink)}
.sec-head h2{grid-column:1/8;font-size:clamp(32px,4.4vw,60px);font-weight:900;line-height:1.1}
.sec-head p{grid-column:9/13;color:var(--mute);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rule);background:#fff;padding:9px 14px;font-size:14px;font-weight:700;color:#333;transition:border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip em{font-style:normal;font-family:var(--lat);font-size:12px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] em{color:#bbb}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:13px 20px;font-weight:700;font-size:14px;z-index:90;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.memo-only{display:none!important}
body.presenter .memo-only{display:block!important}
body.presenter .memo-only.flex{display:flex!important}
body.presenter tr.memo-only{display:table-row!important}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:7fr 5fr;min-height:640px}
.hero>*{min-width:0}
.hero-copy{background:var(--orange);color:#fff;padding:clamp(40px,6vw,88px) var(--g) clamp(40px,5vw,64px) max(var(--g),calc((100vw - var(--max))/2 + var(--g)));display:flex;flex-direction:column;position:relative;overflow:hidden}
.hero-copy .label{color:rgba(255,255,255,.85)}
.hero-copy h1{font-size:clamp(44px,6.6vw,104px);font-weight:900;line-height:1.02;letter-spacing:-.055em;margin:28px 0 30px}
.hero-copy h1 span{color:var(--ink)}
.hero-copy p{font-size:clamp(16px,1.35vw,19px);max-width:560px;color:rgba(255,255,255,.95)}
.hero-copy .year{position:absolute;right:-.06em;bottom:-.2em;font-family:var(--lat);font-weight:900;font-style:italic;font-size:clamp(140px,19vw,300px);line-height:1;color:var(--peach);opacity:.45;pointer-events:none;letter-spacing:-.04em}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:40px;position:relative;z-index:1}
.hero-cta .btn{border-color:#fff;background:transparent;color:#fff}
.hero-cta .btn:hover{background:#fff;color:var(--orange-ink)}
.hero-cta .btn.solid{background:var(--ink);border-color:var(--ink)}
.hero-cta .btn.solid:hover{background:#fff;color:var(--ink);border-color:#fff}
.hero-photo{position:relative;background:var(--char)}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-photo figcaption{position:absolute;left:0;bottom:0;background:#fff;padding:16px 20px;max-width:78%;font-size:13.5px;line-height:1.6}
.hero-photo figcaption b{display:block;font-size:15px}
.hero-photo figcaption span{color:var(--mute);font-size:12.5px}
.paths{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.path{padding:30px var(--g) 30px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;border-right:1px solid var(--rule);transition:background .15s}
.path:last-child{border-right:0}
.path:hover{background:var(--stone)}
.path .lat{font-size:13px;font-weight:800;color:var(--orange-ink)}
.path b{display:block;font-size:19px;letter-spacing:-.02em}
.path span{font-size:13.5px;color:var(--mute)}
.path .arr{font-family:var(--lat);font-size:24px}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.area{display:flex;flex-direction:column;min-height:380px;padding:30px 28px 28px;text-align:left;transition:transform .2s}
.area:hover{transform:translateY(-6px)}
.area .rn{font-family:var(--lat);font-weight:900;font-size:64px;line-height:1;letter-spacing:-.04em}
.area h3{font-size:26px;font-weight:900;margin:22px 0 10px}
.area p{font-size:14px;opacity:.85}
.area .stat{margin-top:auto;padding-top:22px;border-top:1px solid currentColor}
.area .stat b{display:block;font-family:var(--lat);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.1}
.area .stat span{font-size:12.5px;opacity:.8}
.area .go{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-top:16px}
.a-dom{background:var(--orange);color:#fff}
.a-intl{background:var(--char);color:#fff}
.a-cs{background:var(--peach);color:var(--ink)}
.a-er{background:var(--stone);color:var(--ink)}
.kw{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.kw>div{grid-column:span 6;min-width:0}
.kw h3{font-size:20px;font-weight:800;display:flex;align-items:baseline;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.kw h3 .label{color:var(--mute)}
.kw .chips{display:flex;flex-wrap:wrap;gap:8px}
.feat{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.fcard{display:flex;flex-direction:column;gap:16px;min-width:0}
.fcard:first-child{grid-column:span 6}
.fcard:not(:first-child){grid-column:span 3}
.fcard .ph{aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--stone)}
.fcard:first-child .ph{aspect-ratio:16/11}
.fcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.fcard:hover .ph img{transform:scale(1.04)}
.fcard .code{font-family:var(--lat);font-size:12.5px;font-weight:800;color:var(--orange-ink);letter-spacing:.08em}
.fcard h3{font-size:clamp(20px,2vw,28px);font-weight:900}
.fcard:first-child h3{font-size:clamp(26px,2.8vw,40px)}
.fcard p{font-size:14.5px;color:var(--mute)}
.cases{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.case{padding:24px 24px 26px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.case:nth-child(3n+2),.case:nth-child(3n){padding-left:24px;border-left:1px solid var(--rule)}
.case .co{font-family:var(--lat);font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--orange-ink)}
.case b{font-size:17px;line-height:1.45;letter-spacing:-.02em}
.case span{font-size:13.5px;color:var(--mute)}
.case .pg{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--ink)}
.case:hover b{text-decoration:underline;text-decoration-color:var(--orange);text-underline-offset:4px}
.src{font-size:12.5px;color:var(--mute);margin-top:16px}
.modes{border-top:2px solid var(--ink)}
.mode{display:grid;grid-template-columns:60px 1.1fr 2fr 120px;gap:20px;align-items:center;padding:22px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.mode .lat{font-weight:800;color:var(--orange-ink)}
.mode b{font-size:20px;letter-spacing:-.02em}
.mode span{font-size:14px;color:var(--mute)}
.mode .ct{text-align:right;font-family:var(--lat);font-weight:800;font-size:15px}
.mode:hover{background:var(--stone)}
.band{background:var(--ink);color:#fff}
.band .wrap{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:center;padding-block:72px}
.band h2{grid-column:1/9;font-size:clamp(30px,4vw,54px);font-weight:900;line-height:1.12}
.band h2 em{font-style:normal;color:var(--orange)}
.band .act{grid-column:9/13;display:flex;flex-direction:column;gap:10px}
.band .btn{border-color:#fff;background:transparent;color:#fff}
.band .btn.or{background:var(--orange);border-color:var(--orange)}
.band .btn:hover{background:#fff;color:var(--ink)}

/* ---------- EXPLORE ---------- */
.xhead{background:var(--stone);padding-block:56px 40px}
.xhead .wrap{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end}
.xhead h1{grid-column:1/7;font-size:clamp(36px,5vw,72px);font-weight:900;line-height:1.05}
.search{grid-column:7/13;display:flex;border:2px solid var(--ink);background:#fff}
.search input{flex:1;min-width:0;border:0;padding:16px 18px;font-size:16px;background:transparent;outline:none}
.search button{padding:0 18px;font-weight:800;font-size:14px;border-left:1px solid var(--rule)}
.xbody{display:grid;grid-template-columns:300px 1fr;gap:48px;padding-block:40px 100px}
.xbody>*{min-width:0}
.filters{position:sticky;top:92px;align-self:start;display:flex;flex-direction:column;gap:28px;max-height:calc(100vh - 110px);overflow:auto;padding-right:6px}
.fgroup h3{font-size:12px;font-family:var(--lat);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px;display:flex;justify-content:space-between}
.fgroup .opts{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14.5px;font-weight:600;text-align:left;width:100%}
.opt i{width:16px;height:16px;border:1.5px solid #999;flex-shrink:0;position:relative}
.opt[aria-pressed="true"] i{background:var(--orange);border-color:var(--orange)}
.opt[aria-pressed="true"] i:after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt em{margin-left:auto;font-style:normal;font-family:var(--lat);font-size:12.5px;color:var(--mute)}
.opt[data-n="0"]{opacity:.4}
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:24px;min-height:42px}
.rbar .count{font-size:15px;font-weight:700;margin-right:6px}
.rbar .count b{font-family:var(--lat);font-size:28px;font-weight:900;color:var(--orange-ink);margin-right:4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:6px 8px 6px 12px}
.pill button{color:#fff;font-size:15px;line-height:1;padding:0 3px}
.reset{font-size:13px;font-weight:800;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 24px}
.card{display:flex;flex-direction:column;min-width:0}
.card .ph{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--stone);display:block}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .ph img{transform:scale(1.04)}
.noimg{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:18px;background:var(--char);color:#fff}
.noimg b{font-family:var(--lat);font-size:46px;font-weight:900;line-height:1;color:var(--orange)}
.noimg span{font-size:12px;opacity:.7}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 8px}
.card .code{font-family:var(--lat);font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--orange-ink)}
.card h3{font-size:21px;font-weight:900;line-height:1.3}
.card h3 a:hover{text-decoration:underline;text-decoration-color:var(--orange);text-underline-offset:4px}
.card p{font-size:14px;color:var(--mute);margin-top:8px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.card .tags span{font-size:11.5px;font-weight:700;color:#555;background:var(--stone);padding:3px 8px}
.card .tags span.hit{background:var(--peach-bg);color:var(--orange-ink)}
.card .foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .foot .k{font-size:12px;color:var(--mute)}
.card .foot .k b{display:block;font-family:var(--lat);font-size:19px;color:var(--ink);letter-spacing:-.02em}
.empty{grid-column:1/-1;border:2px dashed var(--rule);padding:56px 32px;text-align:center}
.empty b{display:block;font-size:22px;margin-bottom:8px}
.empty p{color:var(--mute);margin-bottom:20px}

/* ---------- DETAIL ---------- */
.dtop{border-bottom:1px solid var(--rule)}
.dtop .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.back{font-weight:800;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.back:hover{color:var(--orange-ink)}
.dacts{display:flex;gap:8px;flex-wrap:wrap}
.dhero{display:grid;grid-template-columns:6fr 6fr;min-height:520px}
.dhero>*{min-width:0}
.dhero .copy{padding:clamp(36px,5vw,72px) var(--g) clamp(36px,4vw,56px) max(var(--g),calc((100vw - var(--max))/2 + var(--g)));display:flex;flex-direction:column;gap:22px;background:var(--paper)}
.dhero .area-l{display:flex;gap:12px;align-items:center;font-size:13px;font-weight:800}
.dhero .area-l .lat{background:var(--orange);color:#fff;padding:5px 10px;letter-spacing:.06em}
.dhero h1{font-size:clamp(40px,5.4vw,84px);font-weight:900;line-height:1.04;letter-spacing:-.055em}
.dhero .lead{font-size:clamp(17px,1.5vw,21px);font-weight:500;max-width:560px;color:#333}
.kstats{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-top:auto;border-top:2px solid var(--ink)}
.kstats div{padding:16px 16px 4px 0}
.kstats div:nth-child(even){padding-left:16px;border-left:1px solid var(--rule)}
.kstats b{display:block;font-family:var(--lat);font-weight:900;font-size:clamp(26px,2.6vw,38px);letter-spacing:-.03em;line-height:1.1}
.kstats span{font-size:12.5px;color:var(--mute)}
.kstats .tot b{color:var(--orange-ink)}
.dhero .ph{position:relative;background:var(--char);min-height:360px}
.dhero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero .ph .noimg{position:absolute;inset:0}
.dhero .ph .noimg b{font-size:120px}
.dbody{display:grid;grid-template-columns:240px 1fr;gap:56px;padding-block:56px 40px}
.dbody>*{min-width:0}
.toc{position:sticky;top:92px;align-self:start}
.toc ol{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.toc a{display:grid;grid-template-columns:32px 1fr;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px;font-weight:700;color:#555}
.toc a .lat{font-size:12px;font-weight:800;color:#aaa}
.toc a:hover,.toc a.on{color:var(--ink)}
.toc a.on .lat{color:var(--orange-ink)}
.dsec{display:grid;grid-template-columns:repeat(8,1fr);gap:24px;padding-bottom:64px;margin-bottom:64px;border-bottom:1px solid var(--rule);scroll-margin-top:96px}
.dsec:last-child{border-bottom:0;margin-bottom:0}
.dsec>.h{grid-column:1/-1;display:flex;gap:18px;align-items:baseline}
.dsec>.h .lat{font-size:14px;font-weight:900;color:var(--orange-ink)}
.dsec>.h h2{font-size:clamp(24px,2.6vw,34px);font-weight:900}
.dsec>.c{grid-column:1/-1;min-width:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink)}
.fact{padding:20px 20px 20px 0;border-bottom:1px solid var(--rule)}
.fact+.fact{padding-left:20px;border-left:1px solid var(--rule)}
.fact:nth-child(3n+1){padding-left:0;border-left:0}
.fact b{display:block;font-family:var(--lat);font-weight:900;font-size:clamp(30px,3.2vw,46px);color:var(--orange-ink);letter-spacing:-.035em;line-height:1.05}
.fact span{display:block;font-size:14px;margin-top:6px}
.fact small{display:block;font-size:12.5px;color:var(--mute)}
.blist{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 32px}
.blist li{padding:10px 0 10px 22px;border-bottom:1px solid var(--rule);position:relative;font-size:15px}
.blist li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:2px;background:var(--orange)}
.blist strong,.blk strong{color:var(--orange-ink)}
.quote{margin-top:28px;background:var(--peach-bg);padding:26px 30px;font-size:17px;line-height:1.75;font-weight:500;position:relative}
.quote:before{content:"“";font-family:var(--lat);font-weight:900;font-size:72px;line-height:.7;color:var(--orange);display:block;margin-bottom:6px}
.quote cite{display:block;font-style:normal;font-size:13px;color:var(--mute);margin-top:12px;font-weight:700}
.big{font-size:clamp(22px,2.2vw,30px);font-weight:800;line-height:1.4;letter-spacing:-.03em;max-width:820px}
.big em{font-style:normal;color:var(--orange-ink)}
.flow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin-top:26px}
.flow div{padding:18px 26px 18px 20px;background:var(--peach-bg);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);margin-left:-6px}
.flow div:first-child{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);margin-left:0}
.flow div:nth-child(even){background:var(--peach)}
.flow b{display:block;font-size:16px}
.flow span{font-size:13px;color:#5a4a3f}
.ttable{width:100%;border-collapse:collapse;border-top:2px solid var(--ink)}
.ttable th,.ttable td{text-align:left;vertical-align:top;padding:16px 0;border-bottom:1px solid var(--rule);font-size:15px}
.ttable th{width:160px;font-size:13px;font-weight:800;color:var(--mute);padding-right:20px}
.ttable td.todo{color:#9a6b00}
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.blk{border:1.5px solid var(--ink);padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.blk .tg{font-size:12.5px;font-weight:800;color:var(--orange-ink)}
.blk h3{font-size:21px;font-weight:900}
.blk ol,.blk ul{margin:0;padding-left:20px;font-size:14.5px;line-height:1.8}
.blk ol li::marker{font-family:var(--lat);font-weight:800;color:var(--orange-ink)}
.blk.dark{background:var(--char);border-color:var(--char);color:#fff}
.blk.dark .tg{color:var(--peach)}
.blk.dark strong{color:var(--peach)}
.howlist{border-top:2px solid var(--ink)}
.how{display:grid;grid-template-columns:44px 220px 1fr auto;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--rule)}
.how .lat{font-weight:800;color:var(--orange-ink)}
.how b{font-size:17px}
.how span{font-size:14px;color:var(--mute)}
.how .chip{padding:6px 10px;font-size:12.5px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--ink);margin-bottom:32px}
.stats-row div{padding:18px 18px 18px 0;border-bottom:1px solid var(--rule)}
.stats-row div+div{padding-left:18px;border-left:1px solid var(--rule)}
.stats-row b{display:block;font-family:var(--lat);font-weight:900;font-size:clamp(24px,2.3vw,34px);letter-spacing:-.03em}
.stats-row span{font-size:13px;color:var(--mute)}
.subh{font-size:13px;font-weight:800;color:var(--mute);margin:30px 0 12px;letter-spacing:.02em}
.ccases{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ccase{background:var(--stone);padding:20px 22px}
.ccase .co{font-family:var(--lat);font-weight:800;font-size:13px;color:var(--orange-ink)}
.ccase b{display:block;font-size:16.5px;margin:6px 0}
.ccase span{font-size:13.5px;color:#444}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gal figure{margin:0}
.gal button{display:block;width:100%;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--stone)}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gal button:hover img{transform:scale(1.05)}
.gal figcaption{font-size:12.5px;color:var(--mute);margin-top:8px}
.disc{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.disc li{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:15px}
.disc li .lat{font-weight:800;color:var(--orange-ink)}
.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.rel a{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;border:1.5px solid var(--rule);padding:10px}
.rel a:hover{border-color:var(--ink)}
.rel .ph{aspect-ratio:1;max-width:100%;overflow:hidden;background:var(--stone)}
.rel img{width:100%;height:100%;object-fit:cover}
.rel .noimg{padding:8px}.rel .noimg b{font-size:22px}
.rel small{font-family:var(--lat);font-weight:800;font-size:11.5px;color:var(--orange-ink)}
.rel b{display:block;font-size:15.5px;line-height:1.35}
.sdgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.sdgs span{font-size:12.5px;font-weight:700;border:1px solid var(--rule);padding:4px 10px;color:#555}
.dnext{background:var(--stone)}
.dnext .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:28px;flex-wrap:wrap}
.dnext a{display:flex;flex-direction:column;gap:2px;font-weight:800;font-size:18px}
.dnext a small{font-family:var(--lat);font-size:12px;color:var(--mute);letter-spacing:.1em}
.dnext a:last-child{text-align:right}
.dnext a:hover{color:var(--orange-ink)}

/* presenter memo */
.memo{position:fixed;right:0;top:68px;bottom:0;width:min(400px,92vw);background:var(--memo);color:var(--memo-ink);z-index:55;overflow:auto;padding:26px 26px 40px;box-shadow:-20px 0 50px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .25s}
body.presenter.has-memo .memo{transform:none}
body.presenter.has-memo main{padding-right:min(400px,92vw)}
.memo .tag{display:inline-flex;gap:8px;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--memo)!important;background:var(--memo-acc);padding:4px 10px;font-family:var(--lat)}
.memo h3{font-size:22px;margin:14px 0 4px;color:#fff}
.memo .sub{font-size:12.5px;color:#9aa6b3;margin-bottom:18px}
.memo h4{font-size:12px;letter-spacing:.1em;color:var(--memo-acc);margin:22px 0 8px;font-family:var(--lat);font-weight:800}
.memo ol,.memo ul{margin:0;padding-left:20px;font-size:14px;line-height:1.75}
.memo li+li{margin-top:6px}
.memo .chk li{color:#ffd9a8}
.memo .x{position:absolute;top:18px;right:18px;color:#9aa6b3;font-size:22px}
.memo-inline{background:var(--memo);color:var(--memo-ink);padding:16px 18px;font-size:13.5px;margin-top:16px;border-left:4px solid var(--memo-acc)}
.memo-inline b{color:var(--memo-acc);font-family:var(--lat);font-size:11.5px;letter-spacing:.1em;display:block;margin-bottom:4px}

/* dialogs */
dialog{border:0;padding:0;max-width:960px;width:calc(100% - 32px);max-height:calc(100% - 40px);background:#fff;color:var(--ink);box-shadow:0 40px 100px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,20,20,.7)}
.dlg-x{position:absolute;top:14px;right:14px;width:42px;height:42px;background:#fff;font-size:22px;z-index:2;border:1.5px solid var(--ink)}
.sum{display:grid;grid-template-columns:5fr 7fr}
.sum>*{min-width:0}
.sum .l{background:var(--orange);color:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:14px}
.sum .l .lat{font-size:13px;font-weight:800;letter-spacing:.08em}
.sum .l h2{font-size:40px;font-weight:900;line-height:1.08}
.sum .l p{font-size:16px}
.sum .l .kk{margin-top:auto;border-top:1px solid rgba(255,255,255,.6);padding-top:14px}
.sum .l .kk b{display:block;font-family:var(--lat);font-size:40px;font-weight:900;line-height:1.1}
.sum .r{padding:36px 32px;display:flex;flex-direction:column;gap:20px}
.sum .r h3{font-size:12px;font-family:var(--lat);font-weight:800;letter-spacing:.12em;color:var(--orange-ink);margin-bottom:6px}
.sum .r ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.75}
.sum .r .mm{display:flex;flex-wrap:wrap;gap:6px}
.sum .r .mm span{font-size:12.5px;font-weight:700;background:var(--stone);padding:4px 10px}
.lightbox img{width:100%;max-height:80vh;object-fit:contain;background:#111}
.lightbox p{padding:14px 18px;font-size:14px}

/* ---------- PROPOSAL ---------- */
.phead{background:var(--ink);color:#fff;padding-block:56px 44px}
.phead .wrap{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end}
.phead .label{grid-column:1/-1;color:var(--orange)}
.phead h1{grid-column:1/8;font-size:clamp(36px,5vw,72px);font-weight:900;line-height:1.05}
.phead p{grid-column:8/13;color:rgba(255,255,255,.7);font-size:15px}
.pbody{display:grid;grid-template-columns:1fr 360px;gap:48px;padding-block:44px 100px}
.pbody>*{min-width:0}
.plist{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink);counter-reset:pi}
.pitem{display:grid;grid-template-columns:56px 120px 1fr auto;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--rule)}
.pitem .no{font-family:var(--lat);font-weight:900;font-size:30px;color:var(--orange-ink)}
.pitem .ph{aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--stone)}
.pitem .ph img{width:100%;height:100%;object-fit:cover}
.pitem .ph .noimg{padding:8px}.pitem .ph .noimg b{font-size:24px}
.pitem small{font-family:var(--lat);font-weight:800;font-size:12px;color:var(--orange-ink)}
.pitem b{display:block;font-size:19px;letter-spacing:-.02em}
.pitem p{font-size:13.5px;color:var(--mute)}
.pitem .ctl{display:flex;gap:6px}
.ctl button{width:40px;height:40px;border:1.5px solid var(--rule);font-family:var(--lat);font-weight:800;font-size:16px}
.ctl button:hover{border-color:var(--ink)}
.ctl button[disabled]{opacity:.3;pointer-events:none}
.ctl .rm:hover{background:var(--ink);color:#fff}
.pside{position:sticky;top:92px;align-self:start;display:flex;flex-direction:column;gap:16px}
.pbox{border:1.5px solid var(--ink);padding:22px}
.pbox h3{font-size:16px;font-weight:900;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:800;color:var(--mute)}
.fld input,.fld textarea{border:1.5px solid var(--rule);padding:11px 12px;font-size:14.5px;background:#fff;width:100%}
.fld input:focus,.fld textarea:focus{border-color:var(--ink);outline:none}
.fld textarea{min-height:84px;resize:vertical}
.pmix{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--rule)}
.pmix div{padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}
.pmix div b{display:block;font-family:var(--lat);font-size:22px;font-weight:900}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;font-weight:700;margin-top:10px}
.pempty{border:2px dashed var(--rule);padding:64px 32px;text-align:center}
.pempty b{display:block;font-size:24px;margin-bottom:8px}
.pempty p{color:var(--mute);margin-bottom:22px}

/* ---------- SHEET (print) ---------- */
.sheetbar{background:var(--stone);border-bottom:1px solid var(--rule)}
.sheetbar .wrap{display:flex;gap:10px;align-items:center;padding-block:14px;flex-wrap:wrap}
.sheetbar .note{font-size:12.5px;color:var(--mute);margin-left:auto}
.sheet{max-width:980px;margin:40px auto 100px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.08);border:1px solid var(--rule)}
.s-cover{background:var(--orange);color:#fff;padding:56px 56px 48px;position:relative;overflow:hidden}
.s-cover img{height:30px;width:auto;margin-bottom:56px}
.s-cover .lat{font-size:13px;font-weight:800;letter-spacing:.14em}
.s-cover h1{font-size:52px;font-weight:900;line-height:1.08;margin:14px 0 18px}
.s-cover p{font-size:15px;max-width:600px}
.s-cover .meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:36px;font-size:13.5px}
.s-cover .meta b{display:block;font-size:11.5px;letter-spacing:.12em;opacity:.8;font-family:var(--lat)}
.s-cover .yr{position:absolute;right:-10px;bottom:-40px;font-family:var(--lat);font-weight:900;font-style:italic;font-size:190px;color:var(--peach);opacity:.4;line-height:1}
.s-sec{padding:40px 56px;border-bottom:1px solid var(--rule)}
.s-sec h2{font-size:13px;font-family:var(--lat);font-weight:800;letter-spacing:.14em;color:var(--orange-ink);margin-bottom:18px}
.s-toc{width:100%;border-collapse:collapse}
.s-toc td{padding:12px 0;border-bottom:1px solid var(--rule);font-size:14.5px;vertical-align:top}
.s-toc td:first-child{width:44px;font-family:var(--lat);font-weight:900;color:var(--orange-ink)}
.s-toc td:last-child{text-align:right;color:var(--mute);font-size:13px}
.s-prog{padding:40px 56px;border-bottom:1px solid var(--rule);break-inside:avoid}
.s-prog .hd{display:grid;grid-template-columns:1fr 200px;gap:28px;margin-bottom:20px}
.s-prog .hd .lat{font-weight:800;font-size:12.5px;color:var(--orange-ink);letter-spacing:.06em}
.s-prog h3{font-size:30px;font-weight:900;margin:4px 0 8px}
.s-prog .hd p{font-size:15px;color:#333}
.s-prog .hd img{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover}
.s-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.s-cols h4{font-size:12px;font-weight:800;color:var(--mute);margin:0 0 6px}
.s-cols ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
.s-stats{display:flex;flex-wrap:wrap;gap:0;border-top:1.5px solid var(--ink);margin-top:20px}
.s-stats div{padding:10px 20px 10px 0;margin-right:20px;font-size:12px;color:var(--mute)}
.s-stats b{display:block;font-family:var(--lat);font-weight:900;font-size:22px;color:var(--ink)}
.s-modes{margin-top:14px;font-size:13px}
.s-modes b{color:var(--orange-ink)}
.s-foot{padding:28px 56px;font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media print{
  @page{size:A4;margin:12mm}
  body{font-size:12px}
  .top,.sheetbar,.memo,.toast,.noprint{display:none!important}
  body.presenter.has-memo main{padding-right:0}
  .sheet{margin:0;box-shadow:none;border:0;max-width:none}
  .s-cover,.s-cover *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .s-prog{page-break-inside:avoid}
}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .tabs a small{display:none}
  .hero,.dhero{grid-template-columns:1fr}
  .hero-photo{min-height:380px}
  .areas{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr 1fr}
  .xbody{grid-template-columns:1fr;gap:28px}
  .filters{position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .dbody{grid-template-columns:1fr;gap:24px}
  .toc{position:static}.toc ol{display:flex;flex-wrap:wrap;border:0;gap:6px}.toc a{border:1px solid var(--rule);padding:6px 10px;grid-template-columns:auto auto;gap:6px}
  .pbody{grid-template-columns:1fr}
  .pside{position:static}
  .fcard:first-child{grid-column:1/-1}.fcard:not(:first-child){grid-column:span 6}
  .sec-head h2,.sec-head p{grid-column:1/-1}
  .rel{grid-template-columns:1fr 1fr}
  body.presenter.has-memo main{padding-right:0}
}
@media (max-width:760px){
  body{font-size:15px}
  .top .wrap{height:60px;gap:10px}
  .logo span{display:none}
  .tabs a{padding:8px 8px;font-size:12px;letter-spacing:.04em}
  .pswitch{padding:6px 8px}.pswitch .t{display:none}
  .memo{top:60px}
  .paths,.areas,.grid,.cases,.blocks,.ccases,.gal,.rel,.facts,.blist,.s-cols,.sum{grid-template-columns:1fr}
  .path{border-right:0;border-bottom:1px solid var(--rule)}
  .area{min-height:0}
  .case,.case:nth-child(3n+2),.case:nth-child(3n){padding-left:0;border-left:0;padding-right:0}
  .fact,.fact+.fact{padding-left:0;border-left:0}
  .kw>div{grid-column:1/-1}
  .fcard:not(:first-child){grid-column:1/-1}
  .mode{grid-template-columns:40px minmax(0,1fr);gap:6px 14px}.mode span{grid-column:2}.mode .lat{grid-column:1;grid-row:1}.mode b{grid-column:2;grid-row:1}.mode .ct{grid-column:2;text-align:left}
  .band h2,.band .act,.xhead h1,.search,.phead h1,.phead p{grid-column:1/-1}
  .filters{grid-template-columns:1fr}
  .how{grid-template-columns:36px 1fr;gap:4px 12px}.how span,.how .chip{grid-column:2}
  .stats-row,.kstats{grid-template-columns:1fr 1fr}
  .stats-row div:nth-child(3){padding-left:0;border-left:0}
  .flow{grid-auto-flow:row}.flow div,.flow div:first-child{clip-path:none;margin-left:0}
  .ttable th{width:96px}
  .pitem{grid-template-columns:40px 1fr;gap:10px 14px}.pitem .ph{display:none}.pitem .ctl{grid-column:2}
  .sheet{margin:0}.s-cover,.s-sec,.s-prog,.s-foot{padding-inline:22px}.s-prog .hd{grid-template-columns:1fr}.s-cover h1{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ================= v4 · white editorial ================= */
.tabs a{font-family:var(--kr);letter-spacing:-.01em;font-size:14px;font-weight:700}
.tabs a[aria-current="page"]{color:var(--navy);box-shadow:inset 0 -3px 0 var(--brand)}
.h-label{font-size:12px;font-weight:700;letter-spacing:.16em;color:#555}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.brand:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.sec.stone{background:var(--paper)}
.sec-head h2 em{font-style:normal;color:var(--brand)}
.sec-head h2,.xhead h1{color:var(--navy)}

/* hero */
.h2o{background:#fff;padding-block:clamp(56px,8vw,120px) 0}
.h-title{font-size:clamp(38px,6.3vw,104px);font-weight:800;line-height:1.14;letter-spacing:-.05em;color:var(--navy);margin-top:clamp(20px,2.4vw,32px)}
.h-title em{font-style:normal;color:var(--brand)}
.h-row{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:clamp(40px,6vw,88px);align-items:start}
.h-copy{grid-column:1/6;min-width:0}
.h-copy p{font-size:clamp(17px,1.45vw,20px);line-height:1.75;color:#555;max-width:30em}
.h-copy .btn{font-size:16px;padding:17px 26px}
.h-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.h-figs{grid-column:7/13;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-width:0}
.h-figs figure{margin:0;min-width:0}
.h-figs figure:nth-child(2){margin-top:64px}
.h-figs img{width:100%;aspect-ratio:4/5;max-width:100%;object-fit:cover}
.h-figs figcaption{font-size:13px;color:var(--mute);margin-top:10px}
.h-figs figcaption b{color:var(--brand);margin-right:6px}
.paths2{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:clamp(64px,8vw,112px);padding-bottom:clamp(56px,7vw,96px)}
.paths2 a{display:flex;flex-direction:column;gap:6px;padding-top:22px;border-top:2px solid var(--navy)}
.paths2 .n{font-size:13px;font-weight:800;color:var(--brand)}
.paths2 b{font-size:20px;color:var(--navy);letter-spacing:-.02em}
.paths2 span:last-child{font-size:14px;color:var(--mute)}
.paths2 a:hover b{color:var(--brand)}

/* brand block for figures */
.brandband{background:var(--brand);color:#fff;padding-block:clamp(56px,7vw,88px)}
.bb-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.bb-head .h-label{color:#fff}
.bb-head h2{font-size:clamp(28px,3.4vw,46px);font-weight:800;line-height:1.15;color:#fff}
.bb-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0}
.bb-nums.five{grid-template-columns:repeat(5,1fr)}
.bb-nums div{padding:18px 20px 4px 0;border-top:1.5px solid rgba(255,255,255,.75);min-width:0}
.bb-nums div+div{padding-left:20px}

     <div class="builder-step" data-step="5">
      <div class="builder-step-head"><span class="builder-badge">STEP 05</span><div><h3>추가 요청사항을 입력해주세요</h3><p>선택 입력사항입니다. 구체적으로 적어주실수록 더 정교한 협력사업을 제안드릴 수 있습니다.</p></div></div>
      <label class="sr" for="directInput">추가 요청사항</label>
      <textarea class="builder-textarea" id="directInput" placeholder="예: 긴급구호 분야 협력을 검토 중입니다 / 특정 지역·사업장 인근 협력을 우선하고 싶습니다 등">${esc(CB.direct)}</textarea>
     </div>
     <div class="builder-mobile-nav" id="builderMobileNav"><button type="button" id="builderPrev" disabled>← 이전</button><span id="builderProgress">1 / 5</span><button type="button" id="builderNext">다음 →</button></div>
     <div class="builder-cta-row"><button type="button" class="builder-submit" id="builderSubmit" disabled>협력사업 설계하기 →</button><span class="builder-hint" id="builderHint">각 단계에서 최소 1개 이상 선택해주세요.</span></div>
     <div class="builder-transition" id="builderTransition" hidden><div class="builder-transition-dot"></div><p id="transitionText"></p></div>

function initBuilder(){
  const card=(item,group)=>`<button type="button" class="b-card${(group==="region"?CB.region:group==="issue"?CB.issue:CB.struct).has(item.code)?" selected":""}" data-group="${group}" data-code="${item.code}" aria-pressed="${(group==="region"?CB.region:group==="issue"?CB.issue:CB.struct).has(item.code)}">
    <span class="b-check">✓</span><span class="b-head">${item.icon?`<span class="b-icon" aria-hidden="true">${item.icon}</span>`:""}<b>${esc(item.label)}</b></span><span>${esc(item.keywords)}</span></button>`;
  $("#regionGrid").innerHTML=BUILDER_REGIONS.map(i=>card(i,"region")).join("");
  $("#issueGrid").innerHTML=BUILDER_ISSUES.map(i=>card(i,"issue")).join("");
  $("#structureGrid").innerHTML=BUILDER_STRUCTURES.map(i=>card(i,"struct")).join("");
  $("#builder").addEventListener("click",e=>{const el=e.target.closest(".b-card");if(!el)return;
    const set=el.dataset.group==="region"?CB.region:el.dataset.group==="issue"?CB.issue:CB.struct;
    set.has(el.dataset.code)?set.delete(el.dataset.code):set.add(el.dataset.code);
    el.classList.toggle("selected",set.has(el.dataset.code));el.setAttribute("aria-pressed",set.has(el.dataset.code));updateSubmit()});
  $("#companyInput").addEventListener("input",e=>{CB.company=e.target.value;updateSubmit()});
  $("#directInput").addEventListener("input",e=>{CB.direct=e.target.value});
  $("#builderPrev").addEventListener("click",()=>{if(CB.step>1){CB.step--;mobileStep()}});
  $("#builderNext").addEventListener("click",()=>{if(CB.step<5){CB.step++;mobileStep()}});
  $("#builderSubmit").addEventListener("click",submit);
  $("#builderReset").addEventListener("click",()=>{CB.company="";CB.direct="";CB.region.clear();CB.issue.clear();CB.struct.clear();CB.step=1;CB.results=null;render.keep=true;render();$("#builder").scrollIntoView({behavior:"smooth",block:"start"})});
  $("#resultCards").addEventListener("click",e=>{
    const c=e.target.closest(".btn-concept");if(c){openConceptPaper(c.dataset.id);return}
    const a=e.target.closest(".btn-addpool");if(a){addPool(a.dataset.id);return}
    if(e.target.closest("#resultToProposal")){location.hash="proposal"}
  });
  mobileStep();updateSubmit();
  if(CB.results)showResults(true);
}
function updateSubmit(){const ok=coName().length>0&&CB.region.size>0&&CB.issue.size>0&&CB.struct.size>0;
  const b=$("#builderSubmit");if(!b)return;b.disabled=!ok;$("#builderHint").textContent=ok?"아래 버튼을 눌러 협력사업을 확인해보세요.":"각 단계에서 최소 1개 이상 선택해주세요."}
function mobileStep(){$$(".builder-step").forEach(s=>s.classList.toggle("active",+s.dataset.step===CB.step));
  $("#builderProgress").textContent=`${CB.step} / 5`;$("#builderPrev").disabled=CB.step===1;$("#builderNext").hidden=CB.step===5}
const overlap=(a,b)=>a.filter(x=>b.includes(x)).length;
function score(item){
  const sc=coName();
  if(item.company&&sc&&item.company!==sc)return -1;
  if(item.requiresKeyword){const t=(CB.direct||"").toLowerCase();if(!item.requiresKeyword.some(k=>t.includes(k.toLowerCase())))return -1}
  if(item.requiresIssue&&!item.requiresIssue.some(c=>CB.issue.has(c)))return -1;
  if(item.region==="KOREA"&&!CB.region.has("KOREA"))return -1;
  if(item.region==="GLOBAL"&&!CB.region.has("GLOBAL"))return -1;
  const iS=overlap([...CB.issue],item.socialIssues)/CB.issue.size, sS=overlap([...CB.struct],item.structures)/CB.struct.size;
  const ready=item.status==="READY"?10:item.status==="SCALE_UP"?7:item.status==="CO_DESIGN"?4:2;
  const cb=item.company&&item.company===sc?15:0, hb=item.hintCompanies&&item.hintCompanies.includes(sc)?10:0;
  return iS*40+sS*30+ready+cb+hb+(item.spotlight||0);
}
function matchReasons(item){const r=[],sc=coName();
  if(item.company&&item.company===sc)r.push(`${item.company}${josa(item.company,"와")} 이미 진행 중인 협력사례`);
  else if(item.hintCompanies&&item.hintCompanies.includes(sc))r.push(`${sc}의 광물·원자재 공급망과 연결해 함께 검토할 수 있는 사업`);
  else if(sc)r.push(`${sc}의 역량과 결합 가능한 공동기획형 사업`);
  const mi=BUILDER_ISSUES.filter(i=>CB.issue.has(i.code)&&item.socialIssues.includes(i.code));if(mi.length)r.push(`${mi.map(i=>i.label).join("·")}과 연결`);
  const ms=BUILDER_STRUCTURES.filter(s=>CB.struct.has(s.code)&&item.structures.includes(s.code));if(ms.length)r.push(`선호하신 ${ms.map(s=>s.label).join("·")} 방식과 부합`);
  r.push(`월드비전 실행 체계로 ${STATUS_LABEL[item.status]}`);return r}
const displayTitle=item=>{const c=item.company||coName();return item.company?item.title:(c?`${c} × 월드비전 — ${item.shortTitle||item.title}`:item.title)};
function submit(){
  $$("#builder .builder-step, #builder .builder-mobile-nav, #builder .builder-cta-row").forEach(el=>el.style.display="none");
  const t=$("#builderTransition");t.hidden=false;$("#builder").scrollIntoView({behavior:"auto",block:"start"});
  const n=coName(),msgs=[`${n}의 목표를 확인하고 있습니다.`,"월드비전의 R&C와 연결하고 있습니다.","협력모델을 설계하고 있습니다."];let i=0;$("#transitionText").textContent=msgs[0];
  const fast=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const timer=setInterval(()=>{i++;if(i<msgs.length&&!fast)$("#transitionText").textContent=msgs[i];else{clearInterval(timer);showResults()}},fast?50:650);
}
function showResults(restore){
  $("#builderTransition").hidden=true;
  if(restore)$$("#builder .builder-step, #builder .builder-mobile-nav, #builder .builder-cta-row").forEach(el=>el.style.display="none");
  const ranked=COLLAB_BUSINESS.map(item=>({item,s:score(item)})).sort((a,b)=>b.s-a.s).slice(0,5).filter(r=>r.s>0);
  CB.results=ranked.map(r=>r.item.id);
  const nm=(L,S,j)=>L.filter(x=>S.has(x.code)).map(x=>x.label).join(j);
  $("#resultRecap").innerHTML=`<div><b>협력 검토 기업</b><span>${esc(coName())}</span></div><div><b>사업 지역</b><span>${esc(nm(BUILDER_REGIONS,CB.region," · "))}</span></div><div><b>사회문제</b><span>${esc(nm(BUILDER_ISSUES,CB.issue," + "))}</span></div><div><b>선호 사업구조</b><span>${esc(nm(BUILDER_STRUCTURES,CB.struct," · "))}</span></div>`
   +(CB.direct.trim()?`<div class="result-recap-note"><b>추가 요청사항</b><span>${esc(CB.direct.trim())}</span></div>`:"");
  const ideas=CB.struct.has("CODESIGN")?(CODESIGN_IDEAS[coName()]||[]):[];
  const ideasHTML=ideas.length?`<div class="result-ideas"><h5>공동기획형 · ${esc(coName())}의 특성을 반영한 신규 사업 아이디어</h5><p>기존 사업에서 고르는 대신, 기업의 자산과 접점을 반영해 처음부터 함께 설계해볼 수 있는 사업 형태의 예시입니다. 세부 내용은 협의를 통해 구체화합니다.</p><ul>${ideas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  $("#resultCards").innerHTML=ideasHTML+(ranked.map((r,idx)=>{const item=r.item;const pm=POOL_TO_P[item.id]||[];
   return `<article class="result-card ${idx===0?"rank-1":""}">
    <div class="result-card-head"><span class="result-rank">${idx+1}</span><h5>${esc(displayTitle(item))}</h5>${item.spotlight?`<span class="result-new">NEW 제안</span>`:""}<span class="result-status ${item.status}">${STATUS_LABEL[item.status]}</span></div>
    <p class="result-summary">${hi(gen(item,item.summary))}</p>
    <ul class="result-reasons">${matchReasons(item).map(x=>`<li><b>✓</b> ${esc(x)}</li>`).join("")}</ul>
    ${idx===0?`<div class="result-flow-mini"><div><b>INPUT</b><span>${esc(gen(item,item.input[0]||""))}</span></div><div><b>OUTPUT</b><span>${esc(item.output[0]||"")}</span></div><div><b>OUTCOME</b><span>${esc(item.outcome[0]||"")}</span></div><div><b>IMPACT</b><span>${esc(item.impact[0]||"")}</span></div></div>`:""}
    <div class="result-actions"><button type="button" class="btn-concept" data-id="${item.id}">Concept Paper 보기</button>${pm.length?`<button type="button" class="btn-inquire btn-addpool" data-id="${item.id}">연결 사업을 맞춤형 제안에 담기 (${pm.map(id=>byId[id].t).join(", ")})</button>`:""}</div>
   </article>`}).join("")||`<p style="color:var(--muted);font-size:14px">선택하신 조건과 바로 연결되는 사업을 찾지 못했습니다. 조건을 조정해 다시 시도해보세요.</p>`)
   +`<div class="result-disclaimer">위 결과는 선택하신 조건을 기준으로 도출한 <b>대략적인 추천값</b>입니다. 기업별 특성에 꼭 맞는 <b>세부 맞춤형 사업 설계</b>는 별도 문의를 통해 월드비전 기업파트너십팀과 함께 진행할 수 있습니다.<br><button type="button" id="resultToProposal">맞춤형 제안 화면으로 이동 →</button></div>`;
  $("#builderResult").hidden=false;
}
function addPool(id){const pm=POOL_TO_P[id]||[];const before=S.prop.length;pm.forEach(p=>{if(!S.prop.includes(p))S.prop.push(p)});save("wvp-proposal",S.prop);syncAdd();
  toast(S.prop.length>before?`맞춤형 제안에 ${S.prop.length-before}개 사업을 담았습니다 · 총 ${S.prop.length}개`:"이미 제안에 담긴 사업입니다")}
function openConceptPaper(id){
  const item=COLLAB_BUSINESS.find(x=>x.id===id);if(!item)return;
  const n=item.narrative||{}, li=a=>(a||[]).map(x=>`<li>${esc(gen(item,x))}</li>`).join("");
  const regionLabel=item.region==="KOREA"?"국내":item.region==="GLOBAL"?"국제":"국내+국제";
  const mc=BUILDER_CAPS.filter(c=>(item.impactMetrics||[]).includes(c.code)).map(c=>c.label).join(" · ");
  const company=item.company||coName()||"기업";
  const relatedDocs=(PROPOSAL_FILES[item.id]||[]).map(refDocById).filter(Boolean);
  const pm=POOL_TO_P[item.id]||[];
  $("#modalBody").innerHTML=`<div class="cp-doc">
   <div class="cp-page">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-right:46px"><div class="cp-eyebrow">${esc(company)} × WORLD VISION · ${item.conceptNote?"CONCEPT NOTE":"CONCEPT PAPER"}</div><span class="result-status ${esc(item.status)}">${esc(STATUS_LABEL[item.status])}</span></div>
    <h1>${esc(displayTitle(item))}</h1>
    <p class="cp-lead">${esc(gen(item,n.problem||""))}</p>
    <div class="cp-topline"></div>
    <div class="cp-facts"><div class="cp-fact"><b>사업 대상</b><span>${esc(item.target||"-")}</span></div><div class="cp-fact"><b>지역</b><span>${esc(regionLabel)}</span></div><div class="cp-fact"><b>사업 기간</b><span>협의를 통해 확정</span></div><div class="cp-fact"><b>협력 방식</b><span>${esc((item.partnershipType||[]).join(" · ")||"-")}</span></div></div>
    ${item.referenceNote?`<p class="cp-note">📎 ${esc(item.referenceNote)}</p>`:""}
    <section><div class="cp-section-label">WHY THIS PARTNERSHIP</div><h2>사업 개요 · 목적</h2><div class="cp-why"><div class="cp-statement">${hi(gen(item,item.summary))}</div><div class="cp-goal"><small>사업 목적</small><strong>${esc(gen(item,n.purpose||""))}</strong></div></div></section>
    <section><div class="cp-section-label">HOW WE SOLVE IT</div><h2>해결 방법</h2><p class="cp-approach">${esc(gen(item,n.approach||""))}</p></section>
   </div>
   <div class="cp-page">
    <section style="margin-top:0"><h2>사업 구조</h2><div class="cp-flow"><div class="cp-node"><div class="tag">INPUT</div><ul>${li(item.input)}</ul></div><div class="cp-node"><div class="tag">OUTPUT</div><ul>${li(item.output)}</ul></div><div class="cp-node"><div class="tag">OUTCOME</div><ul>${li(item.outcome)}</ul></div><div class="cp-node"><div class="tag">IMPACT</div><ul>${li(item.impact)}</ul></div></div></section>
    <section><div class="cp-section-label">COLLABORATION</div><h2>${esc(company)}의 역량 × World Vision의 현장 전문성</h2><div class="cp-roles"><div class="cp-role sk"><h3>${esc(company)} · 자원과 참여</h3><ul>${li(n.skRole)}</ul></div><div class="cp-role wv"><h3>WORLD VISION · 현장과 실행</h3><ul>${li(n.wvRole)}</ul></div></div></section>
    <section><div class="cp-section-label">PROCESS</div><h2>추진 프로세스</h2><div class="cp-process">${(n.process||[]).map(s=>`<div class="cp-step"><b>${esc(s.step)}</b>${esc(s.label)}</div>`).join("")}</div></section>
    <section><div class="cp-section-label">EXPECTED EFFECT</div><h2>기대 효과</h2><ul class="cp-outcomes">${li(item.impact)}</ul>${mc?`<p class="cp-outcomes-note">CSR 성과 보고 시 ${esc(mc)} 지표로 제시할 수 있습니다.</p>`:""}</section>
    ${(item.refPhotos||[]).length?`<section><div class="cp-section-label">FIELD REFERENCE</div><h2>참고 사진</h2><div class="cp-photos">${item.refPhotos.slice(0,2).map(p=>`<figure class="cp-photo"><span class="cp-photo-frame"><img src="${ph(p.id)}" alt=""></span><figcaption>${esc(p.caption)}</figcaption></figure>`).join("")}</div></section>`:""}
    <div class="cp-bottom"><small>${esc(company)} × WORLD VISION</small><h2>이 협력이 만드는 변화</h2><p>${esc((item.impact||[]).join(" · "))}</p></div>
    ${relatedDocs.length?`<div class="cp-downloads"><h3>📖 이 사업의 제안서·자료 보기</h3><p>해당 사업을 더 자세히 확인할 수 있는 월드비전의 제안서·소개자료입니다. 눌러서 원문을 읽어보세요.</p><div class="cp-dl-list">${relatedDocs.map(d=>`<button type="button" class="cp-dl" data-refdoc="${esc(d.id)}"><span>${esc(d.title)}</span><small>읽어보기 ▶</small></button>`).join("")}</div></div>`:""}
    <div class="cp-foot-row"><p>본 컨셉페이퍼는 월드비전이 보유한 공개 자료를 기반으로 자동 구성된 초안이며, 도출된 내용은 대략적인 값입니다. 기업별 세부 맞춤형 사업 설계는 별도 문의를 통해 진행되며, 상세 조건은 협의를 통해 확정됩니다.</p>
     <span style="display:flex;gap:8px;flex-wrap:wrap">${pm.length?`<button type="button" class="submit-btn cp-print-btn btn-addpool-cp" data-id="${item.id}" style="background:var(--navy)">맞춤형 제안에 담기</button>`:""}<button type="button" class="submit-btn cp-print-btn" id="cpPrint">인쇄 / PDF로 저장</button></span></div>
   </div></div>`;
  $$("#modalBody [data-refdoc]").forEach(b=>b.addEventListener("click",()=>openDoc(b.dataset.refdoc,()=>openConceptPaper(id))));
  $("#cpPrint").addEventListener("click",()=>{try{window.print()}catch(e){toast("이 화면에서는 인쇄할 수 없습니다")}});
  const ab=$("#modalBody .btn-addpool-cp");if(ab)ab.addEventListener("click",()=>addPool(id));

/* 브랜드 블록 숫자: 화면에 들어올 때 0부터 최종값까지 올라가는 효과 (최종값은 HTML에 그대로 있음) */
function countUp(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!("IntersectionObserver" in window))return;
  $$("dd[data-count]").forEach(el=>{
    const m=el.dataset.count.match(/^([\d,.]+)(.*)$/);if(!m)return;
    const target=parseFloat(m[1].replace(/,/g,"")),dec=(m[1].split(".")[1]||"").length,suf=m[2],unit=el.querySelector("small")?el.querySelector("small").outerHTML:"",final=el.innerHTML;
    const fmt=v=>v.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf+unit;
    const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;io.disconnect();
      const t0=performance.now(),D=1800;const step=now=>{if(!document.body.contains(el))return;const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);el.innerHTML=p<1?fmt(target*e):final;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}),{threshold:.35});
    io.observe(el)})
}

const NEED_LEX=[
 {re:/아동|어린이|아이|청소년|학생|교육|학습|학교|꿈|진로|도서관/,int:["edu"],why:"아동·교육"},

const NEED_STOP=new Set("사업 사회공헌 기업 우리 회사 있습니다 싶습니다 고민 고민하고 찾고 있는 통해 위한 직접 참여할 참여 분야 관심 지원 지원하고 연결 연결하는 활용 방법 방식 진행 생각 예정 정도 함께 관련 대한 기존 발전 발전시키고 싶은 하고 원합니다 계획 필요 가능 가능한 사회 문제 수 등".split(" "));
function analyzeNeed(text){
  const t=text||"";const I={},M={},why=[],res=[];let area=null;
  NEED_LEX.forEach(x=>{if(x.re.test(t)){x.int.forEach(k=>I[k]=1);why.push(x.why);if(x.area)area=x.area}});
  NEED_RES.forEach(x=>{if(x.re.test(t)){M[x.mode]=1;res.push(x.why)}});
  if(/국내/.test(t)&&!/국내외/.test(t))area="dom";
  if(/국내외/.test(t)){area=null;if(!M.overseas){M.overseas=1;res.push("국내·해외 모두")}}
  const budget=(t.match(/(\d[\d,.]*\s*(?:억|천만|백만|만)\s*원?)/)||[])[1]||null;
  const people=(t.match(/(\d[\d,]*)\s*명/)||[])[1]||null;
  const impact=/성과|측정|임팩트|보고서|평가|SROI|지표/i.test(t);
  const scored=P.map(p=>{let s=0;const r=[];
    const im=p.int.filter(k=>I[k]);if(im.length){s+=im.length*6;r.push(`관심 분야(${im.map(k=>intName[k]).join(", ")})와 연결`)}
    const mm=Object.keys(M).filter(k=>p.modes[k]);if(mm.length){s+=mm.length*4;r.push(`${mm.map(k=>modeName[k]).join(", ")} 근거가 있는 사업`)}
    if(area&&p.area===area){s+=3;r.push(`${AREAS[area].name} 사업`)}
    if(area&&p.area!==area&&!(area==="intl"&&p.modes.overseas))s-=4;
    const words=[...new Set(t.split(/[\s,.·/()!?~]+/).map(w=>w.replace(/(을|를|이|가|은|는|의|에|와|과|로|으로|에서|하고|하는|하며|까지)$/,"")).filter(w=>w.length>=2&&!NEED_STOP.has(w)))];
    const hit=words.filter(w=>strip(p.t+" "+p.content.map(c=>c.h+" "+c.items.join(" ")).join(" ")).includes(w));
    if(hit.length){s+=Math.min(hit.length,2);r.push(`‘${hit.slice(0,2).join("’, ‘")}’ 내용 포함`)}
    return {p,s,r}}).filter(x=>x.s>=5).sort((a,b)=>b.s-a.s).slice(0,4);
  const cs=[...new Set(scored.flatMap(x=>casesOf(x.p.id)))].slice(0,3);
  return {I,M,why,res,area,budget,people,impact,scored,cs};
}

     :r.impact?`<div class="tnone"><b>성과 측정과 임팩트 보고는 특정 사업이 아니라 모든 협력에 적용되는 방식입니다.</b><p>측정하고 싶은 사업 분야(예: 아동·교육, 환경, 해외 식수)를 함께 적어 주시면 관련 사업을 추천합니다. 진행 중인 사회공헌 사업의 성과 체계는 <a href="#strengths" data-scroll="consult">상담</a>을 통해 함께 검토할 수 있습니다.</p></div>`
     :`<div class="tnone"><b>입력하신 내용과 바로 연결되는 사업을 찾지 못했습니다.</b><p>관심 있는 사회문제나 대상을 조금 더 구체적으로 적어 주시거나, <a href="#test">맞춤형 파트너십 테스트</a>를 이용하거나, 상담을 통해 방향을 함께 찾아보세요.</p></div>`}
    ${r.cs.length?`<h3>유사한 기업 파트너십</h3><div class="ccases">${r.cs.map(c=>`<div class="ccase"><span class="co">${c.co}</span><b>${c.t}</b><span>${c.d}</span></div>`).join("")}</div><p class="src">출처: 월드비전 파트너십 페이지 협력 사례</p>`:""}
    <p class="need-n">이 제안은 입력하신 문장의 키워드를 플랫폼에 수록된 실제 사업·협력 사례와 대조해 만든 초안입니다. 세부 내용은 상담을 통해 구체화합니다.</p>
  </div>`;
}
function needClick(e){
  const ex=e.target.closest("[data-ex]");if(ex){NEED.text=NEED_EX[+ex.dataset.ex];save("wvp-need",NEED);$("#needText").value=NEED.text;$("#needText").focus();return true}
  if(e.target.closest("#needAddAll")){const r=analyzeNeed(NEED.text);const b=S.prop.length;r.scored.forEach(x=>{if(!S.prop.includes(x.p.id))S.prop.push(x.p.id)});save("wvp-proposal",S.prop);syncAdd();toast(S.prop.length>b?`추천 사업 ${S.prop.length-b}개를 맞춤형 제안에 담았습니다`:"이미 모두 담긴 사업입니다");return true}
  if(e.target.closest("#needFilter")){const r=analyzeNeed(NEED.text);S.f={q:"",area:r.area?[r.area]:[],int:Object.keys(r.I),mode:Object.keys(r.M).filter(k=>k!=="overseas")};save("wvp-filter",S.f);renderExplore();$("#grid").scrollIntoView({behavior:"smooth"});return true}
  return false;
}
document.addEventListener("submit",e=>{if(e.target.id==="needForm"){e.preventDefault();NEED.text=$("#needText").value;NEED.ran=true;save("wvp-need",NEED);
  const box=$("#need");box.outerHTML=needHTML();syncAdd();const r=$("#needResult");r&&r.scrollIntoView({behavior:"smooth",block:"start"})}});
document.addEventListener("input",e=>{if(e.target.id==="needText"){NEED.text=e.target.value;save("wvp-need",NEED)}});
document.addEventListener("click",e=>{const b=e.target.closest(".jmore");if(!b)return;const l=$("#"+b.getAttribute("aria-controls"));const o=l.hidden;l.hidden=!o;b.setAttribute("aria-expanded",String(o));b.querySelector("span").textContent=o?"−":"+"});

/* ---------- router ---------- */
let current=null;
function render(){
  const h=(location.hash||"#home").slice(1);
  const v=$("#view"); let tab="home"; current=null;
  document.body.classList.remove("has-memo");
  if(h==="explore"){v.innerHTML=vExplore();renderExplore();tab="explore"}
  else if(h==="strengths"){v.innerHTML=vStrengths();tab="strengths";startCine()}
  else if(h==="partners"){v.innerHTML=vPartners();tab="partners"}
  else if(h==="collab"){v.innerHTML=vCollab();initBuilder();tab="collab"}
  else if(h==="library"){v.innerHTML=vLibrary();layoutShelves();tab="library"}
  else if(h==="test"){v.innerHTML=vTest();tab="test"}
  else if(h==="proposal"){v.innerHTML=vProposal();tab="proposal"}
  else if(h==="sheet"){v.innerHTML=vSheet();tab="proposal"}
  else if(h.startsWith("p-")&&byId[h.slice(2)]){const p=byId[h.slice(2)];current=p;v.innerHTML=vDetail(p);tab="explore";
    $("#memo").innerHTML=memoHTML(p);document.body.classList.add("has-memo");setupToc()}
  else{v.innerHTML=vHome()}
  $$(".tabs a").forEach(a=>a.toggleAttribute("aria-current",false));
  const t=$(`.tabs a[data-tab="${tab}"]`); if(t)t.setAttribute("aria-current","page");
  $("#memo").setAttribute("aria-hidden",String(!(S.presenter&&current)));
  document.title=(current?current.t+" · ":"")+"월드비전 기업파트너십";
  countUp(); syncAdd(); if(!render.keep)window.scrollTo(0,0); render.keep=false;
}
let lastRoute=null;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);
  S.prev=lastRoute; lastRoute=h; render()});

function setupToc(){
  const links=$$(".toc a");
  links.forEach(a=>a.addEventListener("click",e=>{e.preventDefault();const s=$("#s-"+a.dataset.sec);if(s)s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}));
  if(!("IntersectionObserver" in window))return;
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){links.forEach(l=>l.classList.toggle("on",l.dataset.sec===en.target.id.slice(2)))}})},{rootMargin:"-30% 0px -60% 0px"});
  $$(".dsec").forEach(s=>io.observe(s));
}

/* ---------- events ---------- */
function setPresenter(on){S.presenter=on;save("wvp-presenter",on);document.body.classList.toggle("presenter",on);
  $("#pswitch").setAttribute("aria-pressed",String(on));$("#memo").setAttribute("aria-hidden",String(!(on&&current)));
  $$(".memo-only").forEach(el=>{el.style.display=""});toast(on?"발표자 모드를 켰습니다 · 메모는 오른쪽에 표시됩니다":"발표자 모드를 껐습니다")}
$("#pswitch").addEventListener("click",()=>setPresenter(!S.presenter));

document.addEventListener("click",e=>{
  const t=e.target;
  if(location.hash==="#test"&&testClick(e))return;
  if(location.hash==="#explore"&&needClick(e))return;
  const sc=t.closest("[data-scroll]"); if(sc){e.preventDefault();const el=document.getElementById(sc.dataset.scroll);el&&el.scrollIntoView({behavior:"smooth"});return}
  const ad=t.closest("[data-add]"); if(ad){e.preventDefault();addProp(ad.dataset.add);return}
  const pa=t.closest("[data-parea]"); if(pa){partnerArea=pa.dataset.parea;render.keep=true;render();$("#pa-"+partnerArea)?.focus();return}
  const ga=t.closest("[data-go-area]"); if(ga){gotoExplore({area:[ga.dataset.goArea]});return}
  const gi=t.closest("[data-go-int]"); if(gi){gotoExplore({int:[gi.dataset.goInt]});return}
  const gm=t.closest("[data-go-mode]"); if(gm){$("#dlgSum").open&&$("#dlgSum").close();gotoExplore({mode:[gm.dataset.goMode]});return}
  const op=t.closest(".opt"); if(op){const g=op.dataset.f,k=op.dataset.k,a=S.f[g];const i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);save("wvp-filter",S.f);renderExplore();return}
  const un=t.closest("[data-unf]"); if(un){const g=un.dataset.unf;if(g==="q"){S.f.q="";const q=$("#q");if(q)q.value=""}else S.f[g]=S.f[g].filter(x=>x!==un.dataset.k);save("wvp-filter",S.f);renderExplore();return}
  if(t.closest("#freset,#freset2")){S.f={q:"",area:[],int:[],mode:[]};save("wvp-filter",S.f);const q=$("#q");if(q)q.value="";renderExplore();return}
  if(t.closest("#back")){if(S.prev!==null&&history.length>1)history.back();else location.hash="explore";return}
  if(t.closest("#sumBtn")&&current){openSum(current);return}
  if(t.closest("#sumX")){$("#dlgSum").close();return}
  if(t.closest("#memoBtn")){document.body.classList.toggle("has-memo");return}
  if(t.closest("#memoX")){setPresenter(false);return}
  const im=t.closest("[data-img]"); if(im){const d=$("#dlgImg");d.innerHTML=`<button class="dlg-x" id="imgX" aria-label="닫기">×</button><img src="img/${im.dataset.img}.jpg" alt="${esc(im.dataset.cap)}"><p>${esc(im.dataset.cap)}</p>`;d.showModal();return}
  if(t.closest("#imgX")){$("#dlgImg").close();return}
  const mv=t.closest("[data-mv]"); if(mv){const i=+mv.dataset.mv,j=i+(+mv.dataset.d);[S.prop[i],S.prop[j]]=[S.prop[j],S.prop[i]];save("wvp-proposal",S.prop);render.keep=true;render();const b=$(`[data-mv="${j}"][data-d="${mv.dataset.d}"]`)||$(`[data-mv="${j}"]`);b&&b.focus();return}
  const rm=t.closest("[data-rm]"); if(rm){const p=byId[rm.dataset.rm];S.prop=S.prop.filter(x=>x!==rm.dataset.rm);save("wvp-proposal",S.prop);render.keep=true;render();toast(`‘${p.t}’을(를) 제안에서 뺐습니다`);return}
  if(t.closest("#pReset")){$("#resetWrap").innerHTML=`<span class="confirm">담은 ${S.prop.length}개 사업과 제안 정보를 모두 비울까요? <button class="btn sm solid" id="pResetY">모두 비우기</button><button class="btn sm" id="pResetN">취소</button></span>`;return}
  if(t.closest("#pResetN")){render();return}
  if(t.closest("#pResetY")){S.prop=[];S.meta={company:"",date:"",by:"",memo:""};save("wvp-proposal",S.prop);save("wvp-meta",S.meta);render();toast("제안 구성을 초기화했습니다");return}
  if(t.closest("#printBtn")){try{window.print()}catch(err){toast("이 화면에서는 인쇄할 수 없습니다. 파일을 브라우저에서 직접 열어 주세요.")}return}
  if(t.closest("#copyBtn")){const txt=sheetText();navigator.clipboard.writeText(txt).then(()=>toast("요약 텍스트를 복사했습니다")).catch(()=>{const r=document.createRange();r.selectNodeContents($("#sheet"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("내용을 선택했습니다 · Ctrl+C로 복사하세요")});return}
});
document.addEventListener("submit",e=>{if(e.target.id==="sform"){e.preventDefault();S.f.q=$("#q").value;save("wvp-filter",S.f);renderExplore()}});
let qt; document.addEventListener("input",e=>{
  if(e.target.id==="q"){clearTimeout(qt);qt=setTimeout(()=>{S.f.q=e.target.value;save("wvp-filter",S.f);renderExplore()},160)}
  if(e.target.dataset.meta){S.meta[e.target.dataset.meta]=e.target.value;save("wvp-meta",S.meta)}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(document.body.classList.contains("modal-open"))return;
  if($("#dlgSum").open||$("#dlgImg").open)return;
  const k=e.key.toLowerCase();
  if(k==="p"){setPresenter(!S.presenter)}
  else if(current&&k==="s"){openSum(current)}
  else if(current&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const i=P.indexOf(current);location.hash="p-"+P[(i+(e.key==="ArrowRight"?1:P.length-1))%P.length].id}
});
["dlgSum","dlgImg"].forEach(id=>$("#"+id).addEventListener("click",e=>{if(e.target.id===id)e.target.close()}));

document.body.classList.toggle("presenter",S.presenter);$("#pswitch").setAttribute("aria-pressed",String(S.presenter));
lastRoute=(location.hash||"#home").slice(1);
render();
</script>
